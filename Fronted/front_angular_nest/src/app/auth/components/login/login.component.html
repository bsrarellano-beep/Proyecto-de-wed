<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <!-- Logo dinámico de Sakai que se adapta al tema claro/oscuro -->
        <img [src]="'assets/layout/images/logo-' + (layoutService.config().colorScheme === 'light' ? 'dark' : 'white') + '.svg'" alt="Sakai logo" class="mb-5 w-6rem flex-shrink-0">
        
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <!-- Icono/Logo para evitar el error 404 si falta avatar.png en assets -->
                    <i class="pi pi-user text-5xl text-primary mb-3"></i>
                    <div class="text-900 text-3xl font-medium mb-3">Bienvenido</div>
                    <span class="text-600 font-medium">Inicia sesión para continuar</span>
                </div>

                <form [formGroup]="loginForm">
                    <div>
                        <label for="email1" class="block text-900 text-xl font-medium mb-2">Correo electrónico</label>
                        <input id="email1" type="email" placeholder="admin@mail.com" pInputText formControlName="email" class="w-full md:w-30rem mb-5" style="padding:1rem">

                        <label for="password1" class="block text-900 font-medium text-xl mb-2">Contraseña</label>
                        <input id="password1" type="password" placeholder="Contraseña" pInputText formControlName="password" class="w-full md:w-30rem mb-5" style="padding:1rem">

                        <div class="flex align-items-center justify-content-between mb-5 gap-5">
                            <div class="flex align-items-center">
                                <p-checkbox id="rememberme1" [binary]="true" class="mr-2"></p-checkbox>
                                <label for="rememberme1">Recordarme</label>
                            </div>
                            <a class="font-medium no-underline ml-2 text-right cursor-pointer" style="color: var(--primary-color)">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button pButton pRipple label="Ingresar" class="w-full p-3 text-xl" (click)="funIngresar()" [disabled]="!loginForm.valid"></button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
